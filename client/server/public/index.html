<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IMovies - Real OTP Verification System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    body {
      background: radial-gradient(circle at top, #1e293b 0%, #0b0f19 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .card-glass {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .form-control {
      background-color: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 0.75rem 1rem;
    }
    .form-control:focus {
      background-color: #0f172a;
      border-color: #e50914;
      color: #ffffff;
      box-shadow: 0 0 0 0.25rem rgba(229, 9, 20, 0.25);
    }
    .btn-cinema {
      background: linear-gradient(135deg, #e50914 0%, #b80710 100%);
      border: none;
      color: #fff;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      transition: all 0.2s ease;
    }
    .btn-cinema:hover {
      background: linear-gradient(135deg, #ff1a26 0%, #d40813 100%);
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(229, 9, 20, 0.4);
      color: #fff;
    }
    .otp-letter-spacing {
      letter-spacing: 0.35em;
      font-size: 1.5rem;
      text-align: center;
      font-weight: 700;
      font-family: monospace;
    }
    .badge-provider {
      background: rgba(229, 9, 20, 0.15);
      color: #ff4d59;
      border: 1px solid rgba(229, 9, 20, 0.3);
    }
  </style>
</head>
<body class="p-3 p-md-4">
  <div class="container" style="max-width: 540px;">
    <div class="card card-glass p-4 p-md-5">
      
      <!-- Brand Header -->
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-danger text-white rounded-3 p-2 mb-2 shadow">
          <i class="bi bi-shield-lock-fill fs-3"></i>
        </div>
        <h2 class="fw-bold mb-1 text-white">Real OTP Verification</h2>
        <p class="text-secondary small mb-0">Powered by Nodemailer (Gmail) & Twilio SMS</p>
      </div>

      <!-- Live Alert Box -->
      <div id="alertBox" class="alert d-none py-2 px-3 small" role="alert"></div>

      <!-- Step 1: Input Form -->
      <form id="sendOtpForm">
        <div class="mb-3">
          <label for="email" class="form-label text-secondary small fw-semibold">
            <i class="bi bi-envelope-fill me-1 text-danger"></i> Gmail / Email Address
          </label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="e.g. samyakjain5407502@gmail.com"
            value="samyakjain5407502@gmail.com"
            required
          />
          <div class="form-text text-secondary small">
            Real OTP email will be delivered to this inbox from your configured Gmail.
          </div>
        </div>

        <div class="mb-4">
          <label for="phone" class="form-label text-secondary small fw-semibold">
            <i class="bi bi-phone-fill me-1 text-warning"></i> Mobile Phone Number
          </label>
          <input
            type="tel"
            class="form-control"
            id="phone"
            placeholder="+919876543210"
          />
          <div class="form-text text-secondary small">
            Mobile SMS will be routed via Twilio.
          </div>
        </div>

        <button type="submit" id="sendBtn" class="btn btn-cinema w-100 d-flex align-items-center justify-content-center gap-2">
          <i class="bi bi-send-fill"></i> Send Real OTP
        </button>
      </form>

      <!-- Step 2: Verification Section (Dynamically revealed) -->
      <div id="verifySection" class="mt-4 pt-4 border-top border-secondary border-opacity-25 d-none">
        <div class="text-center mb-3">
          <span class="badge badge-provider px-3 py-2 rounded-pill small mb-2">
            <i class="bi bi-broadcast me-1"></i> OTP Sent Successfully
          </span>
          <p class="text-secondary small mb-0" id="sentTargetNotice">
            Please check your Gmail inbox and phone message.
          </p>
        </div>

        <form id="verifyOtpForm">
          <div class="mb-3">
            <label for="otpInput" class="form-label text-secondary small fw-semibold">Enter 6-Digit OTP</label>
            <input
              type="text"
              class="form-control otp-letter-spacing"
              id="otpInput"
              placeholder="••••••"
              maxlength="6"
              required
            />
          </div>

          <button type="submit" id="verifyBtn" class="btn btn-success w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2">
            <i class="bi bi-check-circle-fill"></i> Verify OTP
          </button>
        </form>

        <div class="text-center mt-3">
          <button id="resendBtn" class="btn btn-link btn-sm text-secondary text-decoration-none">
            Didn't receive OTP? <span class="text-danger">Resend</span>
          </button>
        </div>
      </div>

      <!-- Footer -->
      <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-10 small text-secondary">
        <a href="http://localhost:3000" class="text-danger text-decoration-none fw-semibold">
          <i class="bi bi-arrow-left"></i> Go to IMovies Ticket Booking App
        </a>
      </div>

    </div>
  </div>

  <script>
    const sendOtpForm = document.getElementById('sendOtpForm');
    const verifyOtpForm = document.getElementById('verifyOtpForm');
    const verifySection = document.getElementById('verifySection');
    const emailInput = document.getElementById('email');
    const phoneInput = document.getElementById('phone');
    const otpInput = document.getElementById('otpInput');
    const sendBtn = document.getElementById('sendBtn');
    const verifyBtn = document.getElementById('verifyBtn');
    const resendBtn = document.getElementById('resendBtn');
    const alertBox = document.getElementById('alertBox');
    const sentTargetNotice = document.getElementById('sentTargetNotice');

    let currentEmail = '';
    let currentPhone = '';

    function showAlert(type, message) {
      alertBox.className = `alert alert-${type} py-2 px-3 small d-flex align-items-center gap-2`;
      alertBox.innerHTML = `<div>${message}</div>`;
      alertBox.classList.remove('d-none');
    }

    sendOtpForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      currentEmail = emailInput.value.trim();
      currentPhone = phoneInput.value.trim();

      sendBtn.disabled = true;
      sendBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Sending OTP...';
      alertBox.classList.add('d-none');

      try {
        const response = await fetch('/api/send-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: currentEmail, phone: currentPhone })
        });
        const data = await response.json();

        if (data.success) {
          showAlert('success', `<i class="bi bi-check-circle me-1"></i> ${data.message}`);
          verifySection.classList.remove('d-none');
          sentTargetNotice.textContent = `Sent to: ${[currentEmail, currentPhone].filter(Boolean).join(' & ')}`;
          otpInput.focus();
        } else {
          showAlert('danger', `<i class="bi bi-exclamation-triangle me-1"></i> ${data.message}`);
        }
      } catch (err) {
        showAlert('danger', 'Network error while sending OTP.');
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerHTML = '<i class="bi bi-send-fill"></i> Send Real OTP';
      }
    });

    verifyOtpForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const otp = otpInput.value.trim();

      verifyBtn.disabled = true;
      verifyBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Verifying...';

      try {
        const response = await fetch('/api/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: currentEmail, phone: currentPhone, otp })
        });
        const data = await response.json();

        if (data.success) {
          showAlert('success', `<i class="bi bi-shield-fill-check fs-5 me-1"></i> <strong>SUCCESS!</strong> ${data.message}`);
          otpInput.classList.add('is-valid');
        } else {
          showAlert('danger', `<i class="bi bi-x-circle me-1"></i> ${data.message}`);
          otpInput.classList.add('is-invalid');
        }
      } catch (err) {
        showAlert('danger', 'Error verifying OTP.');
      } finally {
        verifyBtn.disabled = false;
        verifyBtn.innerHTML = '<i class="bi bi-check-circle-fill"></i> Verify OTP';
      }
    });

    resendBtn.addEventListener('click', () => {
      sendOtpForm.requestSubmit();
    });
  </script>
</body>
</html>
